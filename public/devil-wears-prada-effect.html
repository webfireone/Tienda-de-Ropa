<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
body{position:relative}
.c{position:fixed;inset:0;z-index:99998;overflow:hidden;pointer-events:none}
.w{
  position:absolute;will-change:transform,opacity;opacity:0;pointer-events:none;
  filter:drop-shadow(0 0 12px rgba(200,30,30,0.7));
  transition:opacity 0.15s;
  display:flex;align-items:center;justify-content:center
}
.w.v{opacity:1}
.w img{display:block;pointer-events:none;width:100%;height:100%;object-fit:contain}
.btns{
  position:fixed;bottom:clamp(20px,5vh,50px);left:0;right:0;
  display:flex;align-items:flex-end;justify-content:center;
  gap:clamp(16px,5vw,40px);z-index:99999;pointer-events:none;padding:0 20px
}
.b{
  pointer-events:auto;border:none;cursor:pointer;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1),box-shadow 0.3s,background 0.3s;
  position:relative;box-shadow:0 4px 20px rgba(0,0,0,0.5),0 0 0 1px rgba(255,255,255,0.06);
  outline:none;-webkit-tap-highlight-color:transparent;color:#fff
}
.b:hover{transform:translateY(-6px) scale(1.05)}
.b:active{transform:scale(0.92)}
.bx{
  width:clamp(44px,8vw,64px);height:clamp(44px,8vw,64px);
  background:rgba(0,0,0,0.65);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  padding:0
}
.bx svg{width:40%;height:40%;display:block}
.bx:hover{background:rgba(200,30,30,0.7)}
.bs{
  width:clamp(56px,10vw,80px);height:clamp(56px,10vw,80px);
  background:rgba(0,0,0,0.65);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  overflow:hidden;padding:0;animation:fl 3s ease-in-out infinite
}
.bs img{display:block;width:65%;height:65%;object-fit:contain;margin:auto}
.bs:hover{box-shadow:0 8px 40px rgba(200,50,50,0.4),0 0 0 1px rgba(200,60,60,0.2);animation:none}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.bp{
  width:clamp(44px,8vw,64px);height:clamp(44px,8vw,64px);
  background:rgba(0,0,0,0.65);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  padding:0
}
.bp svg{width:42%;height:42%;display:block}
.bp:hover{background:rgba(255,255,255,0.15)}
</style>

  function processImage(cb){
    log('processing...')

      try{

      var bImg = document.createElement('img')
      bImg.src = PNG; bImg.alt = ''; bImg.draggable = false
      s.appendChild(bImg)
      createShoes()
      log('ready')
    })
  }

  function createShoes(){
    for(var i=0;i<N;i++){
      var w=document.createElement('div');w.className='w'
      var sz=20+(N-i)*3
      var im=document.createElement('img');im.src=PNG;im.alt='';im.draggable=false
      im.style.width=sz+'px';im.style.height=(sz*1.2)+'px'
      w.appendChild(im)
      w.style.left='-30%';w.style.top='50%';w.style.marginTop=-(sz*0.6)+'px';w.style.zIndex=i
      c.appendChild(w)
      shoes.push({el:w,x:-30-i*20,of:i,ph:i*0.9})
    }
  }

  function reset(){
    for(var i=0;i<shoes.length;i++){
      shoes[i].x=-30-shoes[i].of*20
      shoes[i].el.style.opacity='0';shoes[i].el.classList.remove('v')
    }
  }

  function animate(t){
    if(!lt)lt=t
    var dt=t-lt;lt=t;acc+=dt;fc++
    if(acc>=16){
      var st=Math.min((acc/16)|0,3)
      acc=acc%16
      for(var s=0;s<st;s++){
        var any=false
        for(var j=0;j<shoes.length;j++){
          var sh=shoes[j]
          sh.x+=0.5+sh.of*0.03
          if(sh.x>140){sh.el.classList.remove('v');continue}
          any=true
          var fb=Math.sin(fc*0.08+sh.ph)*3
          var sw=Math.sin(fc*0.04+sh.ph*0.3)*1.5
          var sc=0.6+(1-sh.of/N)*0.4
          sh.el.style.left=sh.x+'%'
          sh.el.style.top='50%'
          sh.el.style.marginTop=(-(20+(N-sh.of)*3)*0.6+fb)+'px'
          sh.el.style.transform='translateX('+sw+'px) scale('+sc+')'
          sh.el.classList.add('v')
        }
        if(!any){
          active=false
          if(rid){cancelAnimationFrame(rid);rid=null}
          lt=0;acc=0;fc=0;return
        }
      }
    }
    if(active)rid=requestAnimationFrame(animate)
  }

  function toggle(){
    if(!PNG){log('no png yet');return}
    if(active){
      active=false
      if(rid){cancelAnimationFrame(rid);rid=null}
      lt=0;acc=0;fc=0
      reset();return
    }
    reset()
    active=true;lt=0;acc=0;fc=0
    rid=requestAnimationFrame(animate)
  }

  if(s)s.addEventListener('click',toggle)
  if(x)x.addEventListener('click',function(){
    if(active){active=false;if(rid){cancelAnimationFrame(rid);rid=null}reset()}
  })
  if(p)p.addEventListener('click',function(){
    if(navigator.share)navigator.share({title:'',url:location.href}).catch(function(){})
  })

  init()
})()
</script>
</body>
</html>
